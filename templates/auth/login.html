{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<div class="entry-screen">

    <div class="auth-panel">

        <div class="login-icon-wrap">
            <i class="bi bi-graph-up-arrow login-icon-3d"></i>
        </div>

        <h1>Welcome back</h1>
        <p>Sign in to continue tracking your finances.</p>

        <form method="POST" novalidate>

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text"
                       class="form-control login-input"
                       id="username"
                       name="username"
                       value="{{ username|default('') }}"
                       minlength="3"
                       required
                       autofocus>
            </div>

            <div class="mb-2">
                <label for="password" class="form-label">Password</label>
                <input type="password"
                       class="form-control login-input"
                       id="password"
                       name="password"
                       minlength="8"
                       required>
            </div>

            <button type="submit" class="btn btn-primary w-100 login-btn">
                Sign In
            </button>

        </form>

        <p class="mt-3 mb-0 text-center small text-muted">
            No account yet?
            <a href="{{ url_for('register') }}">Create one</a>
        </p>

    </div>

</div>
{% endblock %}
